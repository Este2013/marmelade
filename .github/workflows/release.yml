name: Release

# Tag a commit `v1.2.3` and push the tag; this builds Windows and publishes the
# release the in-app update check looks for. The tag is what decides the
# version, so `pubspec.yaml` and the tag have to agree -- the build fails below
# if they do not, rather than shipping a build that reports the wrong version
# and never sees itself as out of date.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v1.2.3'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.45.0-0.1.pre
          channel: beta
          cache: true

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $version = $tag -replace '^v', ''
          $pubspec = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value.Trim()
          $pubspecVersion = ($pubspec -split '\+')[0]
          if ($pubspecVersion -ne $version) {
            Write-Error "The tag says $version and pubspec.yaml says $pubspecVersion. A build that reports the wrong version can never see itself as out of date."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: flutter pub get

      - name: Generate drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Test
        # Re-run rather than trusting CI: a tag can point at a commit CI never
        # saw, and a broken release is worse than a late one.
        run: flutter test

      - name: Build
        run: flutter build windows --release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "marmelade-${{ steps.version.outputs.version }}-windows-x64"
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "$name.zip"
          "archive=$name.zip" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: marmelade ${{ steps.version.outputs.version }}
          # A pre-release tag (v1.2.0-beta.1) publishes to the beta channel,
          # which is the same distinction the in-app check makes.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive }}
